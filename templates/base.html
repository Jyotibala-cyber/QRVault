<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QRVault{% endblock %} - Secure File Sharing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/" class="logo">
                <span class="logo-icon">🛡</span>
                <span class="logo-text">QR<span class="accent">Vault</span></span>
            </a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/upload" class="nav-link btn-nav">Secure Share</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>QRVault &mdash; Secure QR-Based File Sharing Platform</p>
            <p class="footer-sub">AES-256-GCM &bull; End-to-End Encrypted &bull; No Account Required</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
